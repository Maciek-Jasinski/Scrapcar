name: Automarket check

on:
  schedule:
    - cron: "0 7-16 * * 1-5"   # pon-pt, co godzinę 9:00-18:00 czasu polskiego (UTC+2 latem)
    - cron: "0 7,10 * * 6"     # sobota, co 3 godziny 9:00-14:00 czasu polskiego (9:00, 12:00)
    - cron: "0 10 * * 0"       # niedziela, raz dziennie o 12:00 czasu polskiego
  workflow_dispatch: {}         # pozwala odpalić ręcznie z zakładki Actions

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaluj zależności
        run: pip install -r requirements.txt

      - name: Uruchom scraper automarket.pl
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automarket_scraper.py

      - name: Uruchom scraper findcar.pl
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python findcar_scraper.py

      - name: Zapisz stan (nowe/znane oferty) z powrotem do repo
        run: |
          git config user.name "automarket-bot"
          git config user.email "automarket-bot@users.noreply.github.com"
          git add automarket_seen_offers.json findcar_seen_offers.json
          git diff --quiet --cached || git commit -m "Aktualizacja listy znanych ofert"
          git push
